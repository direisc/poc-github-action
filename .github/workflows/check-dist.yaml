name: Check dist

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-dist:
    name: Check dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm clean-install

      - name: Build
        run: npm run build

      - name: Compare expected and actual dist/
        run: |
          if git diff --exit-code -- dist/; then
            echo "dist/ matches the build output."
            exit 0
          fi

          {
            echo "::error::dist/ is out of date. Rebuild and commit it before merging."
            echo ""
            echo "Fix locally:"
            echo "  npm clean-install"
            echo "  npm run build"
            echo "  git add dist"
            echo "  git commit -m \"chore: rebuild dist\""
            echo "  git push"
          } >&2

          git --no-pager diff -- dist/ || true
          exit 1
